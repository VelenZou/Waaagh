name: Auto-merge PRs

# Enables GitHub auto-merge (squash) on trusted PRs. The PR then merges by itself
# once all required status checks pass — see repo prerequisites below.
#
# Prerequisites (one-time, in the GitHub UI — this workflow cannot set them):
#   1. Settings → General → Pull Requests → enable "Allow auto-merge".
#   2. Add a branch protection rule / ruleset on `master` that requires the
#      CI status check named "build" (job id in build-plugin.yml). Without a
#      required check there is nothing to wait for and auto-merge won't apply.
#
# Scope: only non-draft PRs from the repo owner / members / collaborators are
# auto-merged. Draft PRs are skipped until marked "Ready for review".

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$REPO" --jq '.allow_auto_merge')" != "true" ]; then
            echo "::notice::'Allow auto-merge' is OFF (Settings → General → Pull Requests). Skipping."
            exit 0
          fi
          # --auto waits for required checks (needs a branch protection rule requiring "build").
          if ! gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "::warning::Could not enable auto-merge. Ensure a branch protection rule on the base branch requires the 'build' status check."
          fi
