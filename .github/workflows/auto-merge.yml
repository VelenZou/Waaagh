name: Auto-merge PRs

# Fully hands-off, no repository settings required (no "Allow auto-merge", no branch
# protection): when the "Build Plugin" CI succeeds for a trusted, non-draft PR, this
# squash-merges it into master/main and deletes the head branch, using GITHUB_TOKEN.
#
# Safety: only merges PRs authored by OWNER / MEMBER / COLLABORATOR (fork/outside PRs
# are skipped), only after CI passed, and only non-draft PRs targeting master/main.
#
# Note: `workflow_run` workflows only run from the copy on the default branch, so this
# takes effect once merged to master; new CI runs then trigger it automatically.

on:
  workflow_run:
    workflows: ["Build Plugin"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Squash-merge PRs whose CI passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "Build Plugin succeeded on branch: $HEAD_BRANCH"
          prs=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open PR for branch $HEAD_BRANCH; nothing to merge."
            exit 0
          fi
          for pr in $prs; do
            info=$(gh api "repos/$REPO/pulls/$pr")
            draft=$(echo "$info" | jq -r '.draft')
            assoc=$(echo "$info" | jq -r '.author_association')
            base=$(echo "$info" | jq -r '.base.ref')
            echo "PR #$pr — draft=$draft author_association=$assoc base=$base"
            if [ "$draft" != "false" ]; then echo "skip: draft PR"; continue; fi
            case "$base" in master|main) ;; *) echo "skip: base $base"; continue ;; esac
            case "$assoc" in OWNER|MEMBER|COLLABORATOR) ;; *) echo "skip: untrusted author ($assoc)"; continue ;; esac
            echo "Merging PR #$pr ..."
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
              || echo "::warning::Could not merge PR #$pr (a branch protection rule may be blocking it)."
          done
