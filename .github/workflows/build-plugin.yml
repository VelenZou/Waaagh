name: Build Plugin

# 打包 Waaagh 插件：
# - push 到 master / 手动触发 / 提 PR：构建并把 zip 作为 workflow 产物上传（Actions 运行页可下载）
# - 推送 v* 标签：创建 GitHub Release 并附带 zip
# - 同一标签且仓库配置了 PUBLISH_TOKEN secret：额外发布到 JetBrains Marketplace
# - 发布（Release / Marketplace）仅限仓库 owner 推送的、且指向 master 上提交的 v* 标签（release-gate 门禁）

on:
  push:
    branches: [ master, main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 插件基于 Gradle 9.7.1 + IntelliJ Platform Gradle Plugin 2.x + IntelliJ IDEA 2026.2.3，需要 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Resolve plugin version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -E '^version\s*=' waaagh/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using plugin version: ${VERSION}"

      - name: Build plugin
        working-directory: waaagh
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin --no-daemon -PpluginVersion="${{ steps.version.outputs.value }}"

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: waaagh-plugin
          path: waaagh/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 90

  release-gate:
    # 发布门禁：只有仓库 owner 推送 v* 标签、且标签指向 master 上的提交时才放行
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tagged commit is on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...master" --jq .status)
          echo "Tagged commit vs master: ${status}"
          case "$status" in
            ahead|identical) echo "OK: tag points to a commit on master";;
            *) echo "::error::The tagged commit is not on master (status=${status}); refusing to release."; exit 1;;
          esac

  release:
    # 仅在发布门禁通过后创建 GitHub Release
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built plugin
        uses: actions/download-artifact@v8
        with:
          name: waaagh-plugin
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-marketplace:
    # 可选：配置 Secrets.PUBLISH_TOKEN（JetBrains Marketplace 永久令牌）后，发布门禁通过时自动上架
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Check Marketplace token
        id: token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "${PUBLISH_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_TOKEN not set — skip JetBrains Marketplace publish."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to JetBrains Marketplace
        if: steps.token.outputs.present == 'true'
        working-directory: waaagh
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          chmod +x gradlew
          ./gradlew publishPlugin --no-daemon -PpluginVersion="${VERSION}"
